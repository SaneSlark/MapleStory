# CMS072 settings.ini：数据库、登录、安全、世界、频道、商城与活动。
# 修改后正常重启启动器和服务端生效；文件使用UTF-8，中文无需转义。

# 数据库连接
sql_port=3306
sql_user=root
sql_password=root
sql_db=v072

# 服务端地址；本机运行使用127.0.0.1。
ip=127.0.0.1
# 是否记录封包日志：true开启，false关闭。
logOps=true
# 是否仅允许管理员登录。
adminOnly=false
# 固定加密IV开关；正常使用保持false。
antiSniff=false

# 游戏内顶部滚动公告，直接填写中文。
scrollingMessage=欢迎来到冒险岛online，梦开始的地方！尽情的享受童话般的世界吧！

# 怪物经验倍率（含BOSS），不改变普通WZ任务基础经验。
expRate=20
# 怪物掉落金币金额倍率，不改变NPC及钓鱼固定金币奖励。
mesoRate=2
# 怪物物品掉落概率倍率（含BOSS），不是固定掉落数量。
dropRate=2
# 仅供NPC的BOSS爆率查询显示；实际BOSS掉落使用dropRate。
bossDropRate=3

# 默认会员等级0～5，5为最高待遇；保留存档及福利领取记录。
defaultVipLevel=5

# 开放频道1～10；对应频道端口7575～7584。
channelCount=10

# 商城屏蔽物品ID，以英文逗号分隔；0表示不额外屏蔽。
cashban=0

# 情人节材料供应开关：true 开启，false 关闭。
# 情人节材料掉落和厨师包装材料商店。
enabled=true

# 材料掉落概率，使用万分比：6000=60%，10000=100%，0=不掉落。
# 各组独立判定，成功时从该组等概率选择一件材料，每组每次最多一件。
# 第0组：情人节任务，白可可、黑可可。
drop.group.0=6000
# 第1组：白色情人节任务，砂糖、草莓。
drop.group.1=6000
# 包装材料商店单价，单位：冒险币／个；每次可购买1～100个。
# 以下为购买材料的价格，制作时仍按原生任务另收制作费用。
# 心形盒子。
shop.4031111=1000
# 黄金丝带。
shop.4031112=1000
# 篮子。
shop.4031113=1500
# 包装材料。
shop.4031114=1000
# 糖果棒。
shop.4031125=500

# 红线女兑换爱心掉率：万分比，6000=60%；10级起，普通野外怪物。
drop.heart=6000

# 本包自定义鱼类兑换：任意有效鱼组合计数。
# 单位为鱼条数，范围1～10000。料理一次5份，超级药水一次5瓶。
# 普通／戒指奖牌仅为本包兑换分类，不代表官方品质；兑换物品均为永久。
# 料理：每次兑换5份料理所需的鱼数；3表示3条鱼换5份料理。
fishing.exchange.foodCost=3
# 药水：每次兑换5瓶超级药水所需的鱼数；5表示5条鱼换5瓶。
fishing.exchange.potionCost=5
# 普通兑换装备：每次兑换1件所需的鱼数；10表示10条鱼换1件。
fishing.exchange.equipCost=10
# 戒指／奖牌：每次兑换1个小鱼戒指或好语言奖牌所需的鱼数；20表示20条鱼换1个。
fishing.exchange.rareCost=20
# 椅子：每次兑换1把钓鱼用椅子所需的鱼数；30表示30条鱼换1把。
fishing.exchange.chairCost=30
