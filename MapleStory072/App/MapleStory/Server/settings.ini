ip=127.0.0.1
logOps=true
adminOnly=false
antiSniff=false
cashban=0

#sql
sql_port=3306
sql_user=root
sql_password=root
sql_db=v072


# 游戏内顶部滚动通知
scrollingMessage=欢迎来到冒险岛online，梦开始的地方！尽情的享受童话般的世界吧！

# 服务器倍率：填整数，1 表示不额外放大基础数值；修改后重新启动服务端生效。
# 基础数据来自客户端资源和本包数据库，不代表数据库内每项概率都是官方原值。
# 怪物经验倍率（含 BOSS）；角色经验增益等效果另外计算。
expRate=20
# 怪物掉落金币的金额倍率；NPC/礼包直接发放的金币不受影响。
mesoRate=2
# 怪物物品掉落概率倍率（含 BOSS），不是每只怪固定掉落的物品数量。
# 每件物品的基础概率在数据库 drop_data 等掉落表中；任务条件和角色掉落增益仍会影响结果。
dropRate=2
# 仅用于 NPC 的 BOSS 爆率查询显示；当前实际 BOSS 掉落使用上面的 dropRate。
bossDropRate=3
# 普通 WZ 任务经验目前为基础 1 倍，未接入 expRate。
# 脚本 gainExp/gainMeso 为固定奖励；gainExpR 等带倍率接口才读取经验倍率。
# 新手礼包固定为 10 经验、100000 金币，在 scripts/npc/2101.js 中设置。

# 开放频道数量：1～10，修改后重启服务端；频道端口7575～7584。
channelCount=10

# 默认会员等级：0～5；5 为最高待遇，保留存档等级及每日工资领取记录。
defaultVipLevel=5

# CMS072 情人节材料供应配置
# 服务端启动时读取；修改数值后需正常保存并重启服务端。

# 情人节材料供应开关：true 开启，false 关闭。
# 仅保留情人节材料掉落和厨师包装材料商店；国庆、周年及字母活动已取消。
enabled=true

# 材料掉落概率，使用万分比：8000=80%，10000=100%，0=不掉落。
# 各组独立判定，成功时从该组等概率选择一件材料，每组每次最多一件。
# 第0组：情人节任务9310，白可可、黑可可。
drop.group.0=8000
# 第1组：白色情人节任务9340，砂糖、草莓。
drop.group.1=8000
# 包装材料商店单价，单位：冒险币／个；每次可购买1～100个。
# 以下为购买材料的价格，制作时仍按原生任务另收制作费用。
# 心形盒子。
shop.4031111=1000
# 黄金丝带。
shop.4031112=1000
# 篮子。
shop.4031113=1500
# 包装材料。
shop.4031114=1000
# 糖果棒。
shop.4031125=500

# 红线女兑换爱心掉率：万分比，8000=80%；10级起，普通野外怪物。
drop.heart=8000
