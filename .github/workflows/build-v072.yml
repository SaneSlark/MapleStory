name: Package CMS072 Portable

on:
  push:
    branches: [v072]
    paths:
      - '.github/workflows/build-v072.yml'
      - 'MapleStory072/App/**'
      - 'MapleStory072/MapleStoryPortable.exe'
      - 'MapleStory072/README.md'
      - 'MapleStory072/RELEASE_NOTES.md'
      - 'MapleStory072/Other/help.html'
      - 'MapleStory072/Other/使用说明.txt'
      - 'MapleStory072/Other/Tools/Build-Release.ps1'
      - 'MapleStory072/Other/Tools/PortableApps.comInstaller/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-cms072-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/v072'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read package version
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $info = [IO.File]::ReadAllText('MapleStory072\App\AppInfo\appinfo.ini')
          $version = [regex]::Match($info, '(?m)^PackageVersion=([0-9.]+)\s*$').Groups[1].Value
          if (!$version) { throw 'Missing PackageVersion in appinfo.ini' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify runtime inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS verification failed' }
          $root = 'MapleStory072'
          if ((Get-Item "$root/App/MapleStory/Client/Map.wz").Length -lt 400000000) { throw 'Client Map.wz is incomplete' }
          if (!(Test-Path "$root/App/MapleStory/Client/PCOM072Original.dll")) { throw 'Original client DLL is missing' }
          if ((Get-ChildItem "$root/App/MapleStory/Server/scripts" -Recurse -Filter '*.js').Count -lt 3279) { throw 'Runtime scripts are incomplete' }
          if (!(Test-Path "$root/RELEASE_NOTES.md")) { throw 'Release notes are missing' }

      # Package existing runtime only; no Java, launcher or database rebuild.
      - name: Package final Portable
        shell: powershell
        run: '& ./MapleStory072/Other/Tools/Build-Release.ps1'

      - name: Verify clean installation and runtime hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'MapleStory072').Path
          $dir = "$root/Other/Releases/${{ steps.version.outputs.version }}"
          $exe = Get-ChildItem -LiteralPath $dir -Filter '*.paf.exe' | Select-Object -First 1
          if (!$exe) { throw 'Installer is missing' }
          $expectedHash = ((Get-Content "$dir/SHA256SUMS.txt" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Installer checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP ('cms072-verify-' + [guid]::NewGuid().ToString('N'))
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "/S /D=$dest" -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Clean installation failed: $($process.ExitCode)" }
          foreach ($excluded in @('README.md','RELEASE_NOTES.md','Other/help.html','Other/使用说明.txt','Other/Source','Other/Tools','Other/Backups','Data/mysql')) {
              if (Test-Path (Join-Path $dest $excluded)) { throw "Unexpected packaged content: $excluded" }
          }
          $verified = 0
          $app = Join-Path $root 'App'
          foreach ($file in Get-ChildItem -LiteralPath $app -Recurse -File) {
              if ($file.Name -in @('help.html','使用说明.txt') -or $file.Extension -eq '.bak') { continue }
              $relative = $file.FullName.Substring($root.Length + 1)
              $installed = Join-Path $dest $relative
              if (!(Test-Path -LiteralPath $installed)) { throw "Missing installed file: $relative" }
              if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $installed).Hash) { throw "Installed file differs: $relative" }
              $verified++
          }
          if ((Get-FileHash "$root/MapleStoryPortable.exe").Hash -ne (Get-FileHash "$dest/MapleStoryPortable.exe").Hash) { throw 'Launcher differs' }
          "Verified clean installation, checksum and $verified runtime file hashes." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload final Portable 
        uses: actions/upload-artifact@v4
        with:
          name: CMS072-v${{ steps.version.outputs.version }}
          path: |
            MapleStory072/Other/Releases/${{ steps.version.outputs.version }}/*.paf.exe
            MapleStory072/Other/Releases/${{ steps.version.outputs.version }}/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      # Publish only after cloud packaging and clean installation pass.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $dir = "MapleStory072/Other/Releases/$version"
          $exe = Get-ChildItem -LiteralPath $dir -Filter '*.paf.exe' | Select-Object -First 1
          if (!$exe) { throw "Packaged EXE not found in $dir" }
          gh release view $tag --json id *>$null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $exe.FullName "$dir/SHA256SUMS.txt" --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          } else {
              gh release create $tag $exe.FullName "$dir/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "MapleStory CMS072 $tag Portable" --notes-file 'MapleStory072/RELEASE_NOTES.md' --latest=false
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
          gh release view $tag --json tagName,assets
