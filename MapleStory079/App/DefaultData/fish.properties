# 钓鱼配置：本文件为默认模板，实际使用 Data/Config/fish.properties。
# FishingItem 是普通奖励池，FishingItemS 是高级奖励池。
# 0 = 金币，1 = 经验，其他数字 = 客户端存在的物品 ID。
# 每个条目等概率；重复条目增加该奖励的权重，列表数量自动计算。
# FishingItemSJ 是高级钓竿采用高级奖励池的概率分母：1 = 必中，6 = 六分之一。
# 普通钓竿使用普通奖励池；高级钓竿未选中高级奖励时也使用普通奖励池。
# FishingMeso/FishingMesoS：金币随机上限，范围为 0 到配置值（含上限）。
# FishingExp/FishingExpS：角色等级 × 0 到配置值的随机数；高级鱼饵使经验翻倍。
# 普通鱼饵 2300000，高级鱼饵 2300001，每次成功处理奖励消耗一个。
# FishingSJ/FishingVIPSJ：普通/高级钓竿间隔，单位毫秒，至少 1000。
# 默认 5000 保留之前实际的 5 秒间隔；修改后重新开始钓鱼生效。
# 奖励物品必须存在；错误配置拒绝启动钓鱼，不消耗鱼饵。
FishingItem=0,1,1302001,1302000,1302018,1302025,4031627,4031628,4031629,4031630,4031631,4031632,4031633,4031634,4031635,4031636,4031637,4031638,4031639,4031640,4031641,4031642,4031643,4031644,4031645,4031646,4031647,4031648
FishingItemS=1,0,1302001,1302000,1302018,1302025,4031627,4031628,4031629,4031630,4031631,4031632,4031633,4031634,4031635,4031636,4031637,4031638,4031639,4031640,4031641,4031642,4031643,4031644,4031645,4031646,4031647,4031648
FishingItemSJ=1
FishingMeso=500
